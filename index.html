
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalize Your Flyer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #172033;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 5px 25px #00000012;
}

h1 {
  text-align: center;
  color: #0047B3;
}

p {
  text-align: center;
  color: #64748b;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  margin-top: 25px;
  border-radius: 8px;
  background: #eee;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: #0047B3;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

</style>
</head>

<body>

<div class="container">

<h1>Personalize Your Flyer</h1>
<p>Upload your picture and enter your name
to create your personalized flyer.</p>

<label>Your Name</label>
<input type="text" id="name"
placeholder="Enter your full name">

<label>Upload Your Photograph</label>
<input type="file" id="photo"
accept="image/*">

<canvas id="canvas"></canvas>

<button id="download" disabled>
Download My Flyer
</button>

</div>

<script>

// LOAD YOUR FLYER
const flyer = new Image();
flyer.src = "flyer.png";

// EDIT THESE SETTINGS TO MATCH YOUR FLYER

const PHOTO_BOX = {
  x: 0.2165,
  y: 0.2274,
  w: 0.5661,
  h: 0.3556,
  shape: "rectangle"


const NAME_POSITION = {
  x: 0.50,
  y: 0.620,
  fontSize: 0.035,
  color: "#000000"
};

};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const nameInput = document.getElementById("name");
const photoInput = document.getElementById("photo");
const downloadBtn = document.getElementById("download");

let uploadedPhoto = null;

function drawFlyer() {

  if (!flyer.complete || !flyer.naturalWidth) return;

  canvas.width = flyer.naturalWidth;
  canvas.height = flyer.naturalHeight;

  // Draw original flyer
  ctx.drawImage(flyer, 0, 0);

  // Draw uploaded photograph
  if (uploadedPhoto) {

    const x = PHOTO_BOX.x * canvas.width;
    const y = PHOTO_BOX.y * canvas.height;
    const w = PHOTO_BOX.w * canvas.width;
    const h = PHOTO_BOX.h * canvas.height;

    const scale = Math.max(
      w / uploadedPhoto.width,
      h / uploadedPhoto.height
    );

    const sw = w / scale;
    const sh = h / scale;

    const sx = (uploadedPhoto.width - sw) / 2;
    const sy = (uploadedPhoto.height - sh) / 2;

    ctx.save();

    ctx.beginPath();

    if (PHOTO_BOX.shape === "circle") {
      ctx.ellipse(
        x + w / 2,
        y + h / 2,
        w / 2,
        h / 2,
        0, 0, Math.PI * 2
      );
    } else {
      ctx.rect(x, y, w, h);
    }

    ctx.clip();

    ctx.drawImage(
      uploadedPhoto,
      sx, sy, sw, sh,
      x, y, w, h
    );

    ctx.restore();
  }

  // Draw visitor's name
  const name = nameInput.value.trim();

  if (name) {
    ctx.save();

    ctx.fillStyle = NAME_POSITION.color;
    ctx.font = `bold ${NAME_POSITION.fontSize * canvas.width}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      name,
      NAME_POSITION.x * canvas.width,
      NAME_POSITION.y * canvas.height
    );

    ctx.restore();
  }

  downloadBtn.disabled = !uploadedPhoto || !name;
}

// Load original flyer
flyer.onload = drawFlyer;
flyer.onerror = () => {
  alert("Could not load flyer.png. Check the filename.");
};

// Enter name
nameInput.addEventListener("input", drawFlyer);

// Upload photo
photoInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please upload an image.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {
      uploadedPhoto = img;
      drawFlyer();
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

// Download personalized flyer
downloadBtn.addEventListener("click", function() {

  const link = document.createElement("a");

  link.download = "My-Personalized-Flyer.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

});

</script>

</body>
</html>
